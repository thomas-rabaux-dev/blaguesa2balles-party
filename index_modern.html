<!DOCTYPE HTML>
<html>
<head>
<title>Site perso de Simon Rabaux</title>
<meta charset="UTF-8">
<style>
body {
    font-family: Verdana, Arial, Helvetica, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.header {
    background: linear-gradient(to bottom, #6699cc, #4477aa);
    color: white;
    padding: 40px 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 36px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.header p {
    margin: 10px 0 0 0;
    font-size: 18px;
}

.nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    background: #e0e0e0;
    flex-wrap: wrap;
}

.nav a {
    display: block;
    padding: 12px 24px;
    background: linear-gradient(to bottom, #ffcc66, #ff9933);
    color: #000;
    text-decoration: none;
    font-weight: bold;
    border: 2px outset #ffcc66;
    border-radius: 5px;
    transition: all 0.2s;
}

.nav a:hover {
    background: linear-gradient(to bottom, #ffd780, #ffaa50);
    border-style: inset;
}

.content {
    padding: 40px 20px;
    text-align: center;
}

.footer {
    padding: 20px;
    text-align: center;
    font-size: 12px;
    color: #666;
    background: #f5f5f5;
    border-top: 1px solid #ddd;
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Site perso de Simon Rabaux</h1>
        <p>Blagues à 2 balles</p>
    </div>
    
    <div class="nav">
        <a href="Pages/photos.html">📷 Photos</a>
        <a href="Pages/blagues.html">😂 Blagues</a>
        <a href="Pages/blaguesperso.html">✍️ Blagues perso</a>
        <a href="Pages/videos.html">🎬 Vidéos</a>
    </div>
    
    <div class="content">
        <p>Bienvenue sur mon site de blagues!</p>
        <p>Choisissez une section ci-dessus pour commencer.</p>
    </div>
    
    <div class="footer">
        Ce site rassemble des photos et des blagues prises notamment sur le site 
        <a href="http://www.humour.com" target="_blank">www.humour.com</a>. Merci à eux.
    </div>
</div>

</body>
</html>
