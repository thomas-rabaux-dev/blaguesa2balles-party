<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blagues à 2 balles - Avertissement</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Verdana, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .warning-box {
            background: white;
            border: 3px solid #cc0000;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        h1 {
            color: #cc0000;
            margin-top: 0;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            margin: 20px 0;
        }
        .buttons {
            margin-top: 30px;
        }
        a {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid;
            transition: all 0.3s;
        }
        .btn-yes {
            background-color: #cc0000;
            color: white;
            border-color: #cc0000;
        }
        .btn-yes:hover {
            background-color: #990000;
            border-color: #990000;
        }
        .btn-no {
            background-color: white;
            color: #333;
            border-color: #333;
        }
        .btn-no:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<div class="warning-box">
    <h1>⚠️ AVERTISSEMENT</h1>
    
    <p>Cette section contient du contenu humoristique qui peut ne pas convenir aux mineurs.</p>
    
    <p><strong>Avez-vous 18 ans ou plus ?</strong></p>
    
    <div class="buttons">
        <a href="contributions-content.html" class="btn-yes">OUI, j'ai 18 ans ou plus</a>
        <br>
        <a href="../index.html" class="btn-no">NON, retour à l'accueil</a>
    </div>
</div>

</body>
</html>
